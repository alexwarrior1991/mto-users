# Solo la aplicacion. Keycloak y el colector de trazas los levanta mto-platform, que es el unico
# entorno local compartido del dominio: mto-users no tiene base de datos ni broker, todo lo que
# administra vive en el Keycloak de la plataforma.
#
#   cd ../mto-platform && docker compose up -d && ./keycloak/apply-partials.sh   # infraestructura + realm
#   docker compose up -d --build                                                 # este servicio contra ella
#
# Lo habitual es no usar este fichero: 'docker compose --profile users up -d' en mto-platform levanta
# la imagen ya publicada. Este sirve para probar una construccion local.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mto-users:${APP_IMAGE_TAG:-latest}
    container_name: mto-users-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Resource server: los tokens que acepta esta API.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set}
      KEYCLOAK_USERS_CLIENT_ID: ${KEYCLOAK_USERS_CLIENT_ID:-mto-users-api}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-mto-users-api}
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:-true}
      # Admin API: el realm que administra y la cuenta de servicio con la que lo hace.
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://auth.mto.local:8082}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mto}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-mto-users-svc}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set}
      KEYCLOAK_CONNECT_TIMEOUT: ${KEYCLOAK_CONNECT_TIMEOUT:-2s}
      KEYCLOAK_READ_TIMEOUT: ${KEYCLOAK_READ_TIMEOUT:-10s}
      APP_PROFILES_PREFIX: ${APP_PROFILES_PREFIX:-mto-}
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-false}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:?APP_CORS_ALLOWED_ORIGIN must be set}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-never}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:-}
    # El 'iss' de los tokens es http://auth.mto.local:8082 y la aplicacion tiene que resolver ese
    # nombre exacto para bajar el JWK Set y para pedir el token de su cuenta de servicio.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${APP_PORT:-8084}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
