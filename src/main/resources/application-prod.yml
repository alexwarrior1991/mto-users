server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Sin valor por defecto a proposito: si la variable falta, la aplicacion no arranca. Es
          # preferible a arrancar apuntando a un emisor de ejemplo y que nadie se entere.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  rabbitmq:
    # Sin usuario ni contrasena por defecto: un despliegue con el broker activo no debe publicar
    # como guest. Con APP_RABBITMQ_ENABLED=false no se usan y pueden faltar.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}

app:
  security:
    client-id: ${KEYCLOAK_USERS_CLIENT_ID}
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:true}
    required-audience: ${KEYCLOAK_AUDIENCE}
    # La documentacion describe la superficie completa de la API: en produccion queda cerrada.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
  keycloak:
    # Sin valores por defecto: un despliegue que administre el realm equivocado, o sin secreto, no
    # debe arrancar.
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

management:
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.alejandro.mtousers: ${LOGGING_LEVEL_APP:INFO}
