name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # GitHub-hosted Ubuntu runners ship with a running Docker daemon, which is what
      # KeycloakUsersIT needs to start quay.io/keycloak/keycloak:26.1 (failsafe, 'verify').
      - name: Build and run the test suite
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Only needed to publish. On a pull request from a fork the token is read-only anyway, which
      # is why the login and the push are conditional below.
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image is built on every pull request too, so a broken Dockerfile shows up before the
      # merge rather than after it. What stays conditional is publishing.
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A working branch must not publish an image someone could deploy by mistake.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Without publishing, the image stays in the runner's local daemon: enough to know the
          # Dockerfile builds and the jar lands where the ENTRYPOINT expects it.
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building does not prove the container starts. mto-users has no database: it only needs the
      # Keycloak settings, and none of them is contacted at boot (JWK Set and service-account token
      # are both lazy), so the smoke test runs with nothing else around.
      - name: Smoke test the image
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name mto-users-smoke -p 8084:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SERVER_PORT=8080 \
            -e KEYCLOAK_ISSUER_URI=http://localhost:8082/realms/mto \
            -e KEYCLOAK_USERS_CLIENT_ID=mto-users-api \
            -e KEYCLOAK_AUDIENCE=mto-users-api \
            -e KEYCLOAK_AUTH_SERVER_URL=http://localhost:8082 \
            -e KEYCLOAK_REALM=mto \
            -e KEYCLOAK_ADMIN_CLIENT_ID=mto-users-svc \
            -e KEYCLOAK_ADMIN_CLIENT_SECRET=smoke-test-only \
            -e APP_CORS_ALLOWED_ORIGIN=http://localhost:4200 \
            -e MTO_TRACING_ENABLED=false \
            "$IMAGE"
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8084/actuator/health > /dev/null; then
              echo "The container answers on /actuator/health"
              docker rm -f mto-users-smoke
              exit 0
            fi
            sleep 2
          done
          echo "The image did not answer within 90s. Container log:"
          docker logs mto-users-smoke
          docker rm -f mto-users-smoke
          exit 1
